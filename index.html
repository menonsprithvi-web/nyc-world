<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midtown NYC — a World Labs Marble world</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; top: 16px; z-index: 3; padding: 8px 12px; border-radius: 8px;
           background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
    .hud h1 { margin: 0 0 4px; font-size: 15px; }
    .hud p { margin: 2px 0; color: rgba(255,255,255,.7); }
    .hud a { color: #9cf; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); pointer-events: none; z-index: 4; }

    /* Web pages floating in the world, projected from 3D every frame. You
       interact with them through the crosshair, so they never take the mouse. */
    #pages { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .page-panel { position: absolute; left: 0; top: 0; width: 800px; height: 600px; display: flex; flex-direction: column;
                  transform-origin: 50% 0; border-radius: 18px; overflow: hidden; background: #fff;
                  box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 20px 60px rgba(0,0,0,.6);
                  transition: height .25s ease, box-shadow .15s; will-change: transform; }
    .page-panel.live { box-shadow: 0 0 0 6px #4da3ff, 0 0 50px rgba(77,163,255,.7); }
    .page-panel iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
    .bar { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px 0 18px; flex: none;
           background: #14161f; color: rgba(255,255,255,.9); font: 600 20px system-ui, sans-serif; }
    .bar .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .back { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.14); font-size: 18px; }
    .bar .back.hover { background: #f5b400; color: #111; }
    .bar .back[hidden] { display: none; }
    /* Closed box: shown when you're too far away to read the page. */
    .page-panel.closed { height: 132px; background: #14161f; }
    .page-panel.closed iframe { display: none; }
    .page-panel .closed-note { display: none; padding: 12px 18px; color: rgba(255,255,255,.6); font: 500 22px system-ui, sans-serif; }
    .page-panel.closed .closed-note { display: block; }
    .page-panel.closed .back { display: none; }

    /* Crosshair dot + hint */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; z-index: 3;
                 border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.7); pointer-events: none;
                 transition: transform .1s, background .1s; }
    #crosshair.on-page { background: #4da3ff; }
    #crosshair.on-link { background: #f5b400; transform: scale(1.8); }
    #hint { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); z-index: 3;
            max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
            padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
            font: 600 13px system-ui, sans-serif; pointer-events: none; white-space: nowrap; }
    #hint:empty { display: none; }
    #hint.bottom { top: auto; bottom: 24px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <h1>Midtown NYC</h1>
    <p>Click to look around with the mouse · Esc to release · WASD move · Q/E down/up · Shift faster</p>
    <p>Walk up to a page to open it · aim the dot: wheel scrolls, click follows a link</p>
    <p>T add floating text · U undo · C copy labels · P show/hide pages</p>
    <p id="quality"></p>
  </div>
  <div id="pages"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="status">Loading 3D world…</div>

  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

    const world = await (await fetch("./world.json")).json();
    const full = new URLSearchParams(location.search).get("quality") === "full";
    const url = full ? world.assets.full_res_spz_url : "./assets/nyc_500k.spz";

    const q = document.getElementById("quality");
    q.innerHTML = full
      ? `Full resolution (~69 MB) · <a href="?">use 500k</a>`
      : `500k splats · <a href="?quality=full">load full resolution (~69 MB)</a>`;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
    scene.add(new SparkRenderer({ renderer }));

    const splats = new SplatMesh({ url });
    // Marble SPZ files use an OpenCV frame; rotate 180° about X for three.js (y-up).
    splats.quaternion.set(1, 0, 0, 0);
    scene.add(splats);

    const status = document.getElementById("status");
    splats.initialized
      .then(() => status.remove())
      .catch((e) => { status.textContent = "Couldn't load the 3D world: " + e; });

    // Spark handles WASD/QE movement; mouse-look is ours (pointer lock).
    const controls = new SparkControls({ canvas });
    controls.fpsMovement.moveSpeed = 1.5;
    controls.pointerControls.enable = false;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Floating text ----------
    // Text is drawn to a canvas and shown on a sprite, so it always faces the
    // camera. depthTest is off so splats never hide it.
    function makeLabel({ text, color = "#ffffff", size = 1 }) {
      const font = "600 64px system-ui, -apple-system, Helvetica, sans-serif";
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = font;
      const padX = 36, padY = 22;
      const w = Math.ceil(ctx.measureText(text).width) + padX * 2;
      const h = 64 + padY * 2;
      c.width = w;
      c.height = h;
      ctx.font = font;
      ctx.fillStyle = "rgba(10,12,20,0.45)";
      ctx.beginPath();
      ctx.roundRect(0, 0, w, h, h / 2);
      ctx.fill();
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = color;
      ctx.textBaseline = "middle";
      ctx.fillText(text, padX, h / 2 + 2);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }),
      );
      const height = 0.35 * size; // world units (≈ metres)
      sprite.scale.set((height * w) / h, height, 1);
      sprite.renderOrder = 10;
      return sprite;
    }

    // Default labels. Positions are [x, y, z] relative to the starting
    // viewpoint: -z is straight ahead, +x is right, +y is up.
    // `url` (optional) shows a web page under the label; `pageWidth` is its
    // width in metres.
    const WIKI = "https://en.wikipedia.org/wiki/";
    const DEFAULT_LABELS = [
      { text: "Midtown Manhattan", position: [0, 3.2, -9], size: 2, color: "#ffffff",
        url: WIKI + "Midtown_Manhattan", pageWidth: 3.2 },
      // Cars, estimated from where they sit in the panorama
      // (left yellow cab, center yellow cab, white sedan on the right).
      { text: "car", position: [-5.5, 0.15, -7.1], size: 1.3, color: "#ffd84a",
        url: WIKI + "Taxicabs_of_New_York_City", pageWidth: 1.4 },
      { text: "car", position: [2.2, 0.15, -8.7], size: 1.3, color: "#ffd84a",
        url: WIKI + "Taxicabs_of_New_York_City", pageWidth: 1.4 },
      { text: "car", position: [7.4, 0.15, -3.1], size: 1.3, color: "#ffffff",
        url: WIKI + "Car", pageWidth: 1.4 },
      { text: "🌭 Street vendors", position: [-5, 1.8, 4], size: 1, color: "#ff8a8a",
        url: WIKI + "Hot_dog_cart", pageWidth: 1.6 },
      { text: "✨ Generated with World Labs Marble", position: [3.5, 0.2, -4], size: 0.7, color: "#9fd4ff",
        url: "https://sparkjs.dev/", pageWidth: 1.2 },
    ];
    const STORE = "nyc-world-labels-v2";
    let labels = JSON.parse(localStorage.getItem(STORE) ?? "null") ?? DEFAULT_LABELS;
    const sprites = [];
    const panels = [];
    let pagesVisible = true;
    const pagesLayer = document.getElementById("pages");

    // ---------- Web pages ----------
    const PANEL_W = 800, PANEL_H = 600; // CSS px; scaled to `pageWidth` metres
    // A page opens once it's drawn at least this big (≈ its 22px body text
    // shows at ~12px on screen) and closes again below CLOSE (hysteresis).
    const OPEN_SCALE = 0.55, CLOSE_SCALE = 0.45;

    // Reader styling injected into every page.
    const READER_CSS = `
      html { scroll-behavior: auto; }
      body { margin: 0; padding: 22px 30px 60px; font: 22px/1.55 Georgia, "Times New Roman", serif; color: #202122; background: #fff; }
      h1, h2, h3 { font-family: system-ui, sans-serif; line-height: 1.25; }
      img { max-width: 100%; height: auto; }
      table { max-width: 100%; }
      .infobox { float: right; width: 42%; margin: 0 0 16px 18px; font-size: 17px; border-collapse: collapse; }
      .infobox td, .infobox th { padding: 3px 6px; vertical-align: top; }
      .mw-editsection, .navbox, .metadata, .ambox, .hatnote, .noprint, .mw-empty-elt, .reference { display: none !important; }
      a { color: #3366cc; text-decoration: none; }
      a.xhair-hover { background: #ffe98a; outline: 3px solid #f5b400; border-radius: 3px; color: #111; }
      .source { margin-top: 40px; font: 16px system-ui, sans-serif; color: #72777d; }
    `;

    const wikiTitle = (u) => {
      const m = u.match(/^https:\/\/en\.wikipedia\.org\/wiki\/([^?#]+)/);
      return m && !/^[A-Za-z_]+:/.test(decodeURIComponent(m[1])) ? decodeURIComponent(m[1]) : null;
    };

    // Fetch a page as same-origin HTML (no scripts) so the crosshair can
    // scroll it and follow its links.
    async function fetchPageHtml(pageUrl) {
      const title = wikiTitle(pageUrl);
      if (title) {
        const api = "https://en.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&origin=*" +
          "&redirects=1&mobileformat=1&disableeditsection=1&prop=text|displaytitle&page=" + encodeURIComponent(title);
        const data = await (await fetch(api)).json();
        if (data.error) throw new Error(data.error.info);
        return {
          title: data.parse.title,
          html: `<!doctype html><html><head><meta charset="utf-8"><base href="https://en.wikipedia.org/wiki/">` +
            `<style>${READER_CSS}</style></head><body><h1>${data.parse.displaytitle}</h1>${data.parse.text}` +
            `<p class="source">From Wikipedia, the free encyclopedia (CC BY-SA 4.0).</p></body></html>`,
        };
      }
      const res = await fetch(pageUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      doc.querySelectorAll("script, noscript, iframe").forEach((n) => n.remove());
      const base = doc.createElement("base");
      base.href = res.url;
      doc.head.prepend(base);
      const style = doc.createElement("style");
      style.textContent = "a.xhair-hover { background: #ffe98a; outline: 3px solid #f5b400; border-radius: 3px; color: #111; }";
      doc.head.append(style);
      return { title: doc.title || pageUrl, html: "<!doctype html>" + doc.documentElement.outerHTML };
    }

    async function loadPage(p, pageUrl, { push = true } = {}) {
      if (push && p.current) p.history.push(p.current);
      p.current = pageUrl;
      p.backBtn.hidden = p.history.length === 0;
      p.titleEl.textContent = "Loading…";
      try {
        const { title, html } = await fetchPageHtml(pageUrl);
        p.frame.srcdoc = html;
        p.titleEl.textContent = title;
      } catch (err) {
        p.frame.srcdoc = `<body style="font:22px system-ui;padding:30px;color:#444">Couldn't load this page here.<br><small>${String(err.message).replace(/</g, "&lt;")}</small></body>`;
        p.titleEl.textContent = p.label;
      }
    }

    function makePanel(pageUrl, widthM, label) {
      const el = document.createElement("div");
      el.className = "page-panel closed";
      const bar = document.createElement("div");
      bar.className = "bar";
      const backBtn = document.createElement("span");
      backBtn.className = "back";
      backBtn.textContent = "◀ Back";
      backBtn.hidden = true;
      const titleEl = document.createElement("span");
      titleEl.className = "title";
      titleEl.textContent = "📄 " + label;
      bar.append(backBtn, titleEl);
      const note = document.createElement("div");
      note.className = "closed-note";
      note.textContent = "Come closer to read";
      const frame = document.createElement("iframe");
      // Same-origin (srcdoc) but no scripts: we can drive it, it can't run code.
      frame.setAttribute("sandbox", "allow-same-origin");
      el.append(bar, note, frame);
      pagesLayer.appendChild(el);
      return {
        el, frame, backBtn, titleEl, label, url: pageUrl, widthM,
        heightM: (PANEL_H * widthM) / PANEL_W,
        pos: new THREE.Vector3(), open: false, loaded: false, history: [], current: null,
      };
    }

    function setOpen(p, open) {
      if (p.open === open) return;
      p.open = open;
      p.el.classList.toggle("closed", !open);
      if (open && !p.loaded) {
        p.loaded = true;
        loadPage(p, p.url, { push: false });
      }
      if (!open) p.titleEl.textContent = "📄 " + p.label;
      else if (p.frame.contentDocument?.title) p.titleEl.textContent = p.frame.contentDocument.title;
    }

    function renderLabels() {
      for (const s of sprites.splice(0)) {
        scene.remove(s);
        s.material.map.dispose();
        s.material.dispose();
      }
      for (const p of panels.splice(0)) p.el.remove();
      labels.forEach((l, i) => {
        const s = makeLabel(l);
        s.position.fromArray(l.position);
        s.userData.baseY = l.position[1];
        s.userData.phase = i * 1.3;
        scene.add(s);
        sprites.push(s);

        if (l.url) {
          const p = makePanel(l.url, l.pageWidth ?? 1.6, l.text);
          // Hang the page just below the label (p.pos is its top edge).
          p.baseY = l.position[1] - s.scale.y / 2 - 0.1;
          p.pos.set(l.position[0], p.baseY, l.position[2]);
          p.phase = s.userData.phase;
          panels.push(p);
        }
      });
    }

    // Project each page to the screen, size it by distance, open/close it.
    const tmp = new THREE.Vector3();
    function layoutPanels() {
      const halfH = innerHeight / 2;
      const focal = halfH / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      for (const p of panels) {
        // Distance to the panel's middle decides size and readability.
        tmp.set(p.pos.x, p.pos.y - p.heightM / 2, p.pos.z).applyMatrix4(camera.matrixWorldInverse);
        const depth = -tmp.z;
        if (!pagesVisible || depth < 0.3) {
          p.el.style.visibility = "hidden";
          p.onScreen = false;
          continue;
        }
        const scale = (p.widthM * focal) / depth / PANEL_W;
        setOpen(p, p.open ? scale >= CLOSE_SCALE : scale >= OPEN_SCALE);

        tmp.copy(p.pos).project(camera); // top-centre of the panel
        const sx = (tmp.x + 1) * innerWidth / 2;
        const sy = (1 - tmp.y) * halfH;
        const offScreen = Math.abs(tmp.x) > 2 || Math.abs(tmp.y) > 2;
        p.el.style.visibility = offScreen ? "hidden" : "visible";
        p.onScreen = !offScreen;
        p.depth = depth;
        p.scale = scale;
        p.el.style.transform = `translate(${sx - PANEL_W / 2}px, ${sy}px) scale(${scale})`;
        p.el.style.zIndex = String(Math.max(1, Math.round(100000 - depth * 100)));
      }
    }

    // Front-most visible page under a screen point.
    function panelAt(x, y) {
      let best = null;
      for (const p of panels) {
        if (!p.onScreen) continue;
        const r = p.el.getBoundingClientRect();
        if (x < r.left || x > r.right || y < r.top || y > r.bottom) continue;
        if (!best || p.depth < best.depth) best = p;
      }
      return best;
    }

    // ---------- Crosshair ----------
    let looking = false; // pointer locked
    let target = null; // page under the crosshair
    let hoverLink = null; // <a> under the crosshair (inside target's page)
    let hoverBack = false; // crosshair on the page's ◀ Back button
    const crosshair = document.getElementById("crosshair");
    const hint = document.getElementById("hint");

    // What is under the crosshair right now?
    function aim() {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const p = looking ? panelAt(cx, cy) : null;
      let link = null, back = false;
      if (p?.open) {
        const fr = p.frame.getBoundingClientRect();
        const br = p.backBtn.getBoundingClientRect();
        back = !p.backBtn.hidden && cx >= br.left && cx <= br.right && cy >= br.top && cy <= br.bottom;
        const doc = p.frame.contentDocument;
        if (doc && cx >= fr.left && cx <= fr.right && cy >= fr.top && cy <= fr.bottom) {
          // Screen → page coordinates (undo the panel's scale).
          const k = fr.width / p.frame.clientWidth;
          const el = doc.elementFromPoint((cx - fr.left) / k, (cy - fr.top) / k);
          link = el?.closest?.("a[href]") ?? null;
        }
      }
      if (link !== hoverLink) {
        hoverLink?.classList.remove("xhair-hover");
        hoverLink = link;
        hoverLink?.classList.add("xhair-hover");
      }
      if (p !== target) {
        target?.el.classList.remove("live");
        target = p;
      }
      target?.el.classList.toggle("live", !!target?.open);
      hoverBack = back;
      for (const q of panels) q.backBtn.classList.toggle("hover", q === target && back);

      crosshair.classList.toggle("on-page", !!target?.open);
      crosshair.classList.toggle("on-link", !!(hoverLink || hoverBack));
      hint.classList.toggle("bottom", !looking || !!target?.open);
      hint.textContent = !looking ? "Click to look around"
        : hoverBack ? "Click to go back"
        : hoverLink ? `Click: ${hoverLink.textContent.trim().slice(0, 60) || hoverLink.href}`
        : target?.open ? "Scroll to read · aim at a link and click"
        : target ? `Come closer to read “${target.label}”`
        : "";
    }

    function follow(a) {
      const href = a.href; // absolute, thanks to <base>
      const page = target;
      const hashOnly = a.getAttribute("href")?.startsWith("#");
      if (hashOnly) {
        page.frame.contentDocument.getElementById(decodeURIComponent(a.hash.slice(1)))?.scrollIntoView();
      } else if (wikiTitle(href) || (/^https:\/\//.test(href) && !wikiTitle(page.current ?? "") && !/wikipedia\.org/.test(href))) {
        loadPage(page, href.split("#")[0]);
      } else if (/^https?:\/\//.test(href)) {
        open(href, "_blank", "noopener"); // e.g. Wikipedia "File:" pages
      }
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (!looking) {
        try { canvas.requestPointerLock()?.catch?.(() => {}); } catch {}
        return;
      }
      if (hoverBack && target?.history.length) loadPage(target, target.history.pop(), { push: false });
      else if (hoverLink) follow(hoverLink);
    });

    // While looking, the wheel scrolls whatever open page is under the dot.
    addEventListener("wheel", (e) => {
      if (!looking || !target?.open) return;
      e.preventDefault();
      target.frame.contentWindow?.scrollBy(0, e.deltaY);
    }, { passive: false });

    let lookDX = 0, lookDY = 0;
    document.addEventListener("pointerlockchange", () => {
      looking = document.pointerLockElement === canvas;
    });
    document.addEventListener("mousemove", (e) => {
      if (!looking) return;
      lookDX += e.movementX;
      lookDY += e.movementY;
    });

    function applyLook() {
      // Pick up any rotation Spark applied (arrow keys), then add the mouse.
      const eul = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
      const yaw = eul.y - lookDX * 0.0022;
      const pitch = THREE.MathUtils.clamp(eul.x - lookDY * 0.0022, -1.45, 1.45);
      lookDX = lookDY = 0;
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
    }

    // ---------- Keys ----------
    addEventListener("keydown", async (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey) return;
      const key = e.key.toLowerCase();
      if (key === "t") {
        if (document.pointerLockElement) document.exitPointerLock();
        // Place text 3m in front of wherever you're looking.
        const text = prompt("Floating text:");
        if (!text?.trim()) return;
        const pageUrl = prompt("Web page to show below it (optional, https://…):")?.trim();
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        const p = camera.position.clone().addScaledVector(dir, 3);
        const label = { text: text.trim(), position: p.toArray().map((n) => +n.toFixed(2)), size: 1, color: "#ffffff" };
        if (pageUrl && /^https:\/\//.test(pageUrl)) Object.assign(label, { url: pageUrl, pageWidth: 1.6 });
        labels = [...labels, label];
        saveLabels();
        renderLabels();
      } else if (key === "u" && labels.length) {
        labels = labels.slice(0, -1);
        saveLabels();
        renderLabels();
      } else if (key === "p") {
        pagesVisible = !pagesVisible;
      } else if (key === "c") {
        if (document.pointerLockElement) document.exitPointerLock();
        // Paste the result into DEFAULT_LABELS to make your labels permanent.
        const json = JSON.stringify(labels, null, 2);
        console.log(json);
        await navigator.clipboard?.writeText(json).catch(() => {});
        alert("Labels copied to clipboard (also printed in the console).");
      }
    });

    const saveLabels = () => localStorage.setItem(STORE, JSON.stringify(labels));
    renderLabels();

    // ---------- Frame loop ----------
    renderer.setAnimationLoop((time) => {
      controls.update(camera);
      applyLook();
      camera.updateMatrixWorld();

      // Gentle floating bob (the page you're reading holds still).
      const t = time / 1000;
      for (const s of sprites) s.position.y = s.userData.baseY + Math.sin(t * 1.2 + s.userData.phase) * 0.08;
      for (const p of panels) {
        if (p !== target) p.pos.y = p.baseY + Math.sin(t * 1.2 + p.phase) * 0.08;
      }
      layoutPanels();
      aim();
      renderer.render(scene, camera);
    });

    // Hooks for automated tests (headless browsers can't lock the pointer).
    window.__world = {
      setLooking(v) { looking = v; },
      moveNear(i, dist) {
        const p = panels[i];
        const mid = new THREE.Vector3(p.pos.x, p.baseY - p.heightM / 2, p.pos.z);
        const flat = new THREE.Vector3(-p.pos.x, 0, -p.pos.z).normalize(); // towards the start point
        camera.position.copy(mid).addScaledVector(flat, dist);
        const d = mid.clone().sub(camera.position);
        camera.quaternion.setFromEuler(new THREE.Euler(Math.atan2(d.y, Math.hypot(d.x, d.z)), Math.atan2(-d.x, -d.z), 0, "YXZ"));
      },
      reset() { camera.position.set(0, 0, 0); camera.quaternion.identity(); },
      // Turn the view so the screen point (x, y) moves under the crosshair.
      lookAtScreen(x, y) {
        const focal = (innerHeight / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        lookDX += Math.atan((x - innerWidth / 2) / focal) / 0.0022;
        lookDY += Math.atan((y - innerHeight / 2) / focal) / 0.0022;
      },
      backRect: () => { const r = target?.backBtn.getBoundingClientRect(); return r && { x: r.left + r.width / 2, y: r.top + r.height / 2 }; },
      state: () => ({
        looking, target: target?.label ?? null, open: target?.open ?? null,
        link: hoverLink?.textContent.trim() ?? null, back: hoverBack,
        openPanels: panels.filter((p) => p.open).map((p) => p.label),
        current: target?.current ?? null,
        scroll: target?.frame.contentWindow?.scrollY ?? null,
      }),
    };
  </script>
</body>
</html>
