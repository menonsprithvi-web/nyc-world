<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midtown NYC — a World Labs Marble world</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; top: 16px; z-index: 3; padding: 8px 12px; border-radius: 8px;
           background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
    .hud h1 { margin: 0 0 4px; font-size: 15px; }
    .hud p { margin: 2px 0; color: rgba(255,255,255,.7); }
    .hud a { color: #9cf; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); pointer-events: none; z-index: 4; }

    /* Everything floating in the world (buttons, menus, pages) is projected
       from 3D every frame and driven by the crosshair, never the mouse. */
    #world-ui { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .surface { position: absolute; left: 0; top: 0; transform-origin: 50% 0; will-change: transform; }

    /* Circular button next to each label */
    .orb { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
           background: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.85); color: #fff;
           font: 600 40px/1 system-ui, sans-serif; backdrop-filter: blur(4px); transition: background .12s, transform .12s; }
    .orb.hover { background: #fff; color: #111; transform: scale(1.12); }

    /* Menu with chat */
    .menu { width: 420px; height: 560px; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden;
            background: rgba(16,18,28,.92); box-shadow: 0 0 0 2px rgba(255,255,255,.25), 0 20px 60px rgba(0,0,0,.6);
            font: 18px/1.4 system-ui, sans-serif; color: #fff; }
    .menu header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 18px; }
    .menu header h2 { flex: 1; margin: 0; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); font-size: 20px; }
    .menu .sub { padding: 0 18px 8px; color: rgba(255,255,255,.55); font-size: 15px; }
    .menu .log { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 16px; }
    .msg.bot { align-self: flex-start; background: rgba(255,255,255,.1); }
    .msg.me { align-self: flex-end; background: #2f6fed; }
    .menu .input-row { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid rgba(255,255,255,.1); }
    .menu input { flex: 1; min-width: 0; font: 17px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.08);
                  border: 2px solid rgba(255,255,255,.15); border-radius: 12px; padding: 8px 12px; outline: none; }
    .menu input:focus { border-color: #4da3ff; }
    .menu .send { padding: 0 14px; border-radius: 12px; display: grid; place-items: center; background: #2f6fed; font-weight: 600; }
    .menu .hover { outline: 3px solid #f5b400; outline-offset: 2px; }

    /* Web page tiles */
    .tile { width: 800px; height: 600px; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 20px 60px rgba(0,0,0,.6); transition: height .25s ease, box-shadow .15s; }
    .tile.live { box-shadow: 0 0 0 6px #4da3ff, 0 0 50px rgba(77,163,255,.7); }
    .tile iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
    .bar { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px 0 18px; flex: none;
           background: #14161f; color: rgba(255,255,255,.9); font: 600 20px system-ui, sans-serif; }
    .bar .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .back { padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.14); font-size: 18px; }
    .bar .back.hover { background: #f5b400; color: #111; }
    .bar .back[hidden] { display: none; }
    .tile.closed { height: 132px; background: #14161f; }
    .tile.closed iframe, .tile.closed .back { display: none; }
    .tile .closed-note { display: none; padding: 12px 18px; color: rgba(255,255,255,.6); font: 500 22px system-ui, sans-serif; }
    .tile.closed .closed-note { display: block; }

    /* Crosshair dot + hint */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; z-index: 3;
                 border-radius: 50%; background: #fff; pointer-events: none; transition: transform .1s; }
    #crosshair.on-link { transform: scale(1.6); }
    #crosshair.hidden { display: none; }
    #hint { position: fixed; left: 50%; top: calc(50% + 20px); transform: translateX(-50%); z-index: 3;
            max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
            padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
            font: 600 13px system-ui, sans-serif; pointer-events: none; white-space: nowrap; }
    #hint:empty { display: none; }
    #hint.bottom { top: auto; bottom: 24px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <h1>Midtown NYC</h1>
    <p>Click to look around · Esc to release · WASD move · Q/E down/up · Shift faster</p>
    <p>Aim the dot at a ◯ button and click to open its pages + chat · walk up to a page to read it</p>
    <p>On a page: wheel scrolls, click follows a link · T add label · U undo · P hide/show</p>
    <p id="quality"></p>
  </div>
  <div id="world-ui"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="status">Loading 3D world…</div>

  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

    const world = await (await fetch("./world.json")).json();
    const full = new URLSearchParams(location.search).get("quality") === "full";
    const url = full ? world.assets.full_res_spz_url : "./assets/nyc_500k.spz";

    const q = document.getElementById("quality");
    q.innerHTML = full
      ? `Full resolution (~69 MB) · <a href="?">use 500k</a>`
      : `500k splats · <a href="?quality=full">load full resolution (~69 MB)</a>`;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
    scene.add(new SparkRenderer({ renderer }));

    const splats = new SplatMesh({ url });
    // Marble SPZ files use an OpenCV frame; rotate 180° about X for three.js (y-up).
    splats.quaternion.set(1, 0, 0, 0);
    scene.add(splats);

    const status = document.getElementById("status");
    splats.initialized
      .then(() => status.remove())
      .catch((e) => { status.textContent = "Couldn't load the 3D world: " + e; });

    // Spark handles WASD/QE movement; mouse-look is ours (pointer lock).
    const controls = new SparkControls({ canvas });
    controls.fpsMovement.moveSpeed = 1.5;
    controls.pointerControls.enable = false;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Floating words ----------
    // Plain text (no background) drawn to a canvas sprite that always faces
    // the camera. depthTest is off so splats never hide it.
    function makeLabel({ text, color = "#ffffff", size = 1 }) {
      const font = "700 64px system-ui, -apple-system, Helvetica, sans-serif";
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = font;
      const pad = 16;
      const w = Math.ceil(ctx.measureText(text).width) + pad * 2;
      const h = 64 + pad * 2;
      c.width = w;
      c.height = h;
      ctx.font = font;
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 10;
      ctx.fillStyle = color;
      ctx.fillText(text, pad, h / 2 + 2);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }),
      );
      const height = 0.24 * size; // world units (≈ metres)
      sprite.scale.set((height * w) / h, height, 1);
      sprite.renderOrder = 10;
      return sprite;
    }

    // Labels. Positions are [x, y, z] relative to the starting viewpoint:
    // -z is straight ahead, +x is right, +y is up. `query` picks the 6 pages
    // (Wikipedia search); `url` (optional) is pinned as the first page.
    const WIKI = "https://en.wikipedia.org/wiki/";
    const DEFAULT_LABELS = [
      { text: "Midtown Manhattan", position: [0, 3.2, -9], size: 2, color: "#ffffff",
        query: "Midtown Manhattan", url: WIKI + "Midtown_Manhattan" },
      // Cars, estimated from where they sit in the panorama
      // (left yellow cab, center yellow cab, white sedan on the right).
      { text: "car", position: [-5.5, 0.15, -7.1], size: 1.3, color: "#ffd84a",
        query: "New York City taxi", url: WIKI + "Taxicabs_of_New_York_City" },
      { text: "car", position: [2.2, 0.15, -8.7], size: 1.3, color: "#ffd84a",
        query: "yellow cab New York", url: WIKI + "Taxicabs_of_New_York_City" },
      { text: "car", position: [7.4, 0.15, -3.1], size: 1.3, color: "#ffffff",
        query: "automobile", url: WIKI + "Car" },
      { text: "🌭 Street vendors", position: [-5, 1.8, 4], size: 1, color: "#ff8a8a",
        query: "New York City street food", url: WIKI + "Hot_dog_cart" },
      { text: "✨ Generated with World Labs Marble", position: [3.5, 0.2, -4], size: 0.7, color: "#9fd4ff",
        query: "Gaussian splatting", url: "https://sparkjs.dev/" },
    ];
    const STORE = "nyc-world-labels-v3";
    let labels = JSON.parse(localStorage.getItem(STORE) ?? "null") ?? DEFAULT_LABELS;
    const saveLabels = () => localStorage.setItem(STORE, JSON.stringify(labels));

    const uiLayer = document.getElementById("world-ui");
    let uiVisible = true;
    const items = [];    // per label: { data, sprite, baseY, phase, right, toward, orb, cluster }
    const surfaces = []; // everything projected: { el, pos, widthM, pxW, kind, owner, ... }

    // ---------- Page loading (same-origin reading views) ----------
    const TILE_W = 800, TILE_H = 600;

    const READER_CSS = `
      html { scroll-behavior: auto; }
      body { margin: 0; padding: 22px 30px 60px; font: 24px/1.55 Georgia, "Times New Roman", serif; color: #202122; background: #fff; }
      h1, h2, h3 { font-family: system-ui, sans-serif; line-height: 1.25; }
      img { max-width: 100%; height: auto; }
      table { max-width: 100%; }
      .infobox { float: right; width: 42%; margin: 0 0 16px 18px; font-size: 18px; border-collapse: collapse; }
      .infobox td, .infobox th { padding: 3px 6px; vertical-align: top; }
      .mw-editsection, .navbox, .metadata, .ambox, .hatnote, .noprint, .mw-empty-elt, .reference { display: none !important; }
      a { color: #3366cc; text-decoration: none; }
      a.xhair-hover { background: #ffe98a; outline: 3px solid #f5b400; border-radius: 3px; color: #111; }
      .source { margin-top: 40px; font: 16px system-ui, sans-serif; color: #72777d; }
    `;

    const wikiTitle = (u) => {
      const m = u.match(/^https:\/\/en\.wikipedia\.org\/wiki\/([^?#]+)/);
      return m && !/^[A-Za-z_]+:/.test(decodeURIComponent(m[1])) ? decodeURIComponent(m[1]) : null;
    };

    async function searchWiki(query, limit = 6) {
      const api = "https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*" +
        `&srlimit=${limit + 2}&srsearch=` + encodeURIComponent(query);
      const data = await (await fetch(api)).json();
      return (data.query?.search ?? []).map((r) => WIKI + encodeURIComponent(r.title.replace(/ /g, "_")));
    }

    async function fetchPageHtml(pageUrl) {
      const title = wikiTitle(pageUrl);
      if (title) {
        const api = "https://en.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&origin=*" +
          "&redirects=1&mobileformat=1&disableeditsection=1&prop=text|displaytitle&page=" + encodeURIComponent(title);
        const data = await (await fetch(api)).json();
        if (data.error) throw new Error(data.error.info);
        return {
          title: data.parse.title,
          html: `<!doctype html><html><head><meta charset="utf-8"><base href="https://en.wikipedia.org/wiki/">` +
            `<style>${READER_CSS}</style></head><body><h1>${data.parse.displaytitle}</h1>${data.parse.text}` +
            `<p class="source">From Wikipedia, the free encyclopedia (CC BY-SA 4.0).</p></body></html>`,
        };
      }
      const res = await fetch(pageUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      doc.querySelectorAll("script, noscript, iframe").forEach((n) => n.remove());
      const base = doc.createElement("base");
      base.href = res.url;
      doc.head.prepend(base);
      const style = doc.createElement("style");
      style.textContent = "a.xhair-hover { background: #ffe98a; outline: 3px solid #f5b400; border-radius: 3px; color: #111; }";
      doc.head.append(style);
      return { title: doc.title || pageUrl, html: "<!doctype html>" + doc.documentElement.outerHTML };
    }

    const niceTitle = (u) => decodeURIComponent((wikiTitle(u) ?? u).replace(/_/g, " "));

    async function loadPage(t, pageUrl, { push = true } = {}) {
      if (push && t.current) t.history.push(t.current);
      t.current = pageUrl;
      t.backBtn.hidden = t.history.length === 0;
      t.titleEl.textContent = "Loading…";
      try {
        const { title, html } = await fetchPageHtml(pageUrl);
        if (t.current !== pageUrl) return; // superseded
        t.frame.srcdoc = html;
        t.titleEl.textContent = title;
      } catch (err) {
        t.frame.srcdoc = `<body style="font:22px system-ui;padding:30px;color:#444">Couldn't load this page here.<br><small>${String(err.message).replace(/</g, "&lt;")}</small></body>`;
        t.titleEl.textContent = niceTitle(pageUrl);
      }
    }

    // Point a tile at a new page (loads now if it's open, else when opened).
    function setTileUrl(t, pageUrl) {
      t.url = pageUrl;
      t.history = [];
      t.current = null;
      t.loaded = false;
      t.backBtn.hidden = true;
      t.titleEl.textContent = pageUrl ? "📄 " + niceTitle(pageUrl) : "—";
      t.frame.srcdoc = "";
      if (t.open && pageUrl) { t.loaded = true; loadPage(t, pageUrl, { push: false }); }
    }

    function setTileOpen(t, open) {
      if (t.open === open) return;
      t.open = open;
      t.el.classList.toggle("closed", !open);
      if (open && !t.loaded && t.url) {
        t.loaded = true;
        loadPage(t, t.url, { push: false });
      }
    }

    // ---------- Building the floating UI ----------
    function addSurface(el, kind, pxW, widthM, pos, extra = {}) {
      el.classList.add("surface");
      uiLayer.appendChild(el);
      const s = { el, kind, pxW, widthM, pos, ...extra };
      surfaces.push(s);
      return s;
    }

    function makeTile(item, index) {
      const el = document.createElement("div");
      el.className = "tile closed";
      const bar = document.createElement("div");
      bar.className = "bar";
      const backBtn = document.createElement("span");
      backBtn.className = "back";
      backBtn.textContent = "◀ Back";
      backBtn.hidden = true;
      const titleEl = document.createElement("span");
      titleEl.className = "title";
      titleEl.textContent = "Finding pages…";
      bar.append(backBtn, titleEl);
      const note = document.createElement("div");
      note.className = "closed-note";
      note.textContent = "Come closer to read";
      const frame = document.createElement("iframe");
      // Same-origin (srcdoc) but no scripts: we can drive it, it can't run code.
      frame.setAttribute("sandbox", "allow-same-origin");
      el.append(bar, note, frame);
      return addSurface(el, "tile", TILE_W, 1.4, new THREE.Vector3(), {
        owner: item, index, frame, backBtn, titleEl, open: false, loaded: false, history: [], current: null, url: null,
      });
    }

    function makeMenu(item) {
      const el = document.createElement("div");
      el.className = "menu";
      el.innerHTML = `
        <header><h2></h2><span class="x" data-action="close">✕</span></header>
        <div class="sub">6 pages · ask for another topic below</div>
        <div class="log"></div>
        <div class="input-row"><input data-action="chat" placeholder="Ask for a topic…" /><span class="send" data-action="send">Send</span></div>`;
      el.querySelector("h2").textContent = item.data.text;
      const input = el.querySelector("input");
      input.addEventListener("focus", () => { controls.fpsMovement.enable = false; });
      input.addEventListener("blur", () => { controls.fpsMovement.enable = true; });
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") sendChat(item);
        if (e.key === "Escape") input.blur();
      });
      return addSurface(el, "menu", 420, 0.8, new THREE.Vector3(), { owner: item, input, log: el.querySelector(".log") });
    }

    function botSay(item, text) {
      const m = document.createElement("div");
      m.className = "msg bot";
      m.textContent = text;
      item.cluster.menu.log.append(m);
      m.scrollIntoView({ block: "end" });
    }

    async function fillTiles(item, query) {
      const pinned = item.cluster.firstFill && item.data.url ? [item.data.url] : [];
      item.cluster.firstFill = false;
      let found = [];
      try { found = await searchWiki(query); } catch {}
      const urls = [...new Set([...pinned, ...found])].slice(0, 6);
      item.cluster.tiles.forEach((t, i) => setTileUrl(t, urls[i] ?? null));
      return urls;
    }

    async function sendChat(item) {
      const input = item.cluster.menu.input;
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      const m = document.createElement("div");
      m.className = "msg me";
      m.textContent = text;
      item.cluster.menu.log.append(m);
      botSay(item, "Looking…");
      const urls = await fillTiles(item, text);
      item.cluster.menu.log.lastChild.remove();
      botSay(item, urls.length
        ? `Here are ${urls.length} pages about “${text}”: ${urls.map((u, i) => `${i + 1}. ${niceTitle(u)}`).join(" · ")}`
        : `I couldn't find pages about “${text}”.`);
    }

    function openCluster(item) {
      if (item.cluster) return;
      const L = new THREE.Vector3(item.data.position[0], item.baseY, item.data.position[2]);
      const r = item.right, t = item.toward;
      const halfW = item.sprite.scale.x / 2;
      const menuX = halfW + 0.45 + 0.4; // menu centre, to the right of the button
      const menu = makeMenu(item);
      menu.pos.copy(L).addScaledVector(r, menuX).setY(L.y + 0.6);
      const tiles = [];
      const gridStart = menuX + 0.4 + 0.25;
      for (let col = 0; col < 2; col++) {
        for (let row = 0; row < 3; row++) {
          const tile = makeTile(item, tiles.length);
          tile.pos.copy(L)
            .addScaledVector(r, gridStart + 0.7 + col * 1.52)
            .addScaledVector(t, 0.3 + col * 0.6) // curve towards the viewer
            .setY(L.y + 1.6 - row * 1.17);
          tiles.push(tile);
        }
      }
      item.cluster = { menu, tiles, firstFill: true };
      item.orb.el.textContent = "×";
      botSay(item, `Showing pages about “${item.data.query ?? item.data.text}”. Walk up to a page to read it, or ask for another topic.`);
      fillTiles(item, item.data.query ?? item.data.text);
    }

    function closeCluster(item) {
      if (!item.cluster) return;
      for (const s of [item.cluster.menu, ...item.cluster.tiles]) {
        s.el.remove();
        surfaces.splice(surfaces.indexOf(s), 1);
      }
      item.cluster = null;
      item.orb.el.textContent = "+";
    }

    function buildAll() {
      for (const it of items.splice(0)) {
        closeCluster(it);
        scene.remove(it.sprite);
        it.sprite.material.map.dispose();
        it.sprite.material.dispose();
        it.orb.el.remove();
        surfaces.splice(surfaces.indexOf(it.orb), 1);
      }
      labels.forEach((data, i) => {
        const sprite = makeLabel(data);
        sprite.position.fromArray(data.position);
        scene.add(sprite);
        // "toward" points from the label to the starting viewpoint; "right"
        // is to the viewer's right when facing the label.
        const toward = new THREE.Vector3(-data.position[0], 0, -data.position[2]).normalize();
        const right = new THREE.Vector3(toward.z, 0, -toward.x);
        const item = { data, sprite, baseY: data.position[1], phase: i * 1.3, right, toward, cluster: null };
        const orbEl = document.createElement("div");
        orbEl.className = "orb";
        orbEl.textContent = "+";
        item.orb = addSurface(orbEl, "orb", 64, 0.2, new THREE.Vector3(), { owner: item });
        items.push(item);
      });
    }

    // ---------- Projection ----------
    const tmp = new THREE.Vector3();
    function layout(time) {
      const t = time / 1000;
      for (const it of items) {
        const y = it.baseY + Math.sin(t * 1.2 + it.phase) * 0.06;
        it.sprite.position.y = y;
        it.sprite.visible = uiVisible;
        // Orb sits just right of the words, vertically centred on them.
        it.orb.pos.set(it.data.position[0], y + 0.1, it.data.position[2])
          .addScaledVector(it.right, it.sprite.scale.x / 2 + 0.18);
      }
      const halfH = innerHeight / 2;
      const focal = halfH / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      for (const s of surfaces) {
        const pxH = s.el.offsetHeight || s.pxW;
        const heightM = (pxH * s.widthM) / s.pxW;
        tmp.set(s.pos.x, s.pos.y - heightM / 2, s.pos.z).applyMatrix4(camera.matrixWorldInverse);
        const depth = -tmp.z;
        if (!uiVisible || depth < 0.3) {
          s.el.style.visibility = "hidden";
          s.onScreen = false;
          continue;
        }
        const scale = (s.widthM * focal) / depth / s.pxW;
        if (s.kind === "tile") setTileOpen(s, true); // pages are always open and readable
        tmp.copy(s.pos).project(camera); // top-centre
        const sx = (tmp.x + 1) * innerWidth / 2;
        const sy = (1 - tmp.y) * halfH;
        const off = Math.abs(tmp.x) > 2 || Math.abs(tmp.y) > 2;
        s.el.style.visibility = off ? "hidden" : "visible";
        s.onScreen = !off;
        s.depth = depth;
        // Orbs are centred on their point; everything else hangs from it.
        const dy = s.kind === "orb" ? -pxH / 2 : 0;
        s.el.style.transform = `translate(${sx - s.pxW / 2}px, ${sy + dy * scale}px) scale(${scale})`;
        s.el.style.zIndex = String(Math.max(1, Math.round(100000 - depth * 100)));
      }
    }

    const inRect = (el, x, y) => {
      const r = el.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    };

    function surfaceAt(x, y) {
      let best = null;
      for (const s of surfaces) {
        if (!s.onScreen || !inRect(s.el, x, y)) continue;
        if (!best || s.depth < best.depth) best = s;
      }
      return best;
    }

    // ---------- Crosshair ----------
    let looking = false;
    let target = null;    // surface under the dot
    let hoverLink = null; // <a> inside a tile
    let hoverAction = null; // { kind: "orb" | "back" | "close" | "chat" | "send" }
    let hoverEl = null;
    const crosshair = document.getElementById("crosshair");
    const hint = document.getElementById("hint");
    const typing = () => document.activeElement?.tagName === "INPUT";

    function aim() {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const s = looking ? surfaceAt(cx, cy) : null;
      let link = null, action = null, el = null;
      if (s?.kind === "orb") {
        action = "orb"; el = s.el;
      } else if (s?.kind === "menu") {
        el = [...s.el.querySelectorAll("[data-action]")].find((n) => inRect(n, cx, cy)) ?? null;
        action = el?.dataset.action ?? null;
      } else if (s?.kind === "tile" && s.open) {
        if (!s.backBtn.hidden && inRect(s.backBtn, cx, cy)) { action = "back"; el = s.backBtn; }
        const fr = s.frame.getBoundingClientRect();
        const doc = s.frame.contentDocument;
        if (!action && doc && inRect(s.frame, cx, cy)) {
          const k = fr.width / s.frame.clientWidth; // undo the tile's scale
          link = doc.elementFromPoint((cx - fr.left) / k, (cy - fr.top) / k)?.closest?.("a[href]") ?? null;
        }
      }
      if (link !== hoverLink) {
        hoverLink?.classList.remove("xhair-hover");
        hoverLink = link;
        hoverLink?.classList.add("xhair-hover");
      }
      if (el !== hoverEl) {
        hoverEl?.classList.remove("hover");
        hoverEl = el;
        hoverEl?.classList.add("hover");
      }
      if (s !== target) {
        if (target?.kind === "tile") target.el.classList.remove("live");
        target = s;
      }
      if (target?.kind === "tile") target.el.classList.toggle("live", target.open);
      hoverAction = action;

      crosshair.classList.toggle("hidden", typing());
      crosshair.classList.toggle("on-link", !!(hoverLink || hoverAction));
      const reading = target?.kind === "tile" && target.open;
      hint.classList.toggle("bottom", !looking || reading);
      hint.textContent =
        typing() ? "Type a topic and press Enter · click the scene to look around again"
        : !looking ? "Click to look around"
        : action === "orb" ? (s.owner.cluster ? "Click to close pages" : `Click to open pages about “${s.owner.data.text}”`)
        : action === "close" ? "Click to close"
        : action === "chat" ? "Click to type"
        : action === "send" ? "Click to send"
        : action === "back" ? "Click to go back"
        : hoverLink ? `Click: ${hoverLink.textContent.trim().slice(0, 60) || hoverLink.href}`
        : reading ? "Scroll to read · aim at a link and click"
        : "";
    }

    function follow(tile, a) {
      const href = a.href; // absolute, thanks to <base>
      if (a.getAttribute("href")?.startsWith("#")) {
        tile.frame.contentDocument.getElementById(decodeURIComponent(a.hash.slice(1)))?.scrollIntoView();
      } else if (wikiTitle(href) || (/^https:\/\//.test(href) && !wikiTitle(tile.current ?? "") && !/wikipedia\.org/.test(href))) {
        loadPage(tile, href.split("#")[0]);
      } else if (/^https?:\/\//.test(href)) {
        open(href, "_blank", "noopener"); // e.g. Wikipedia "File:" pages
      }
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (!looking) {
        document.activeElement?.blur();
        try { canvas.requestPointerLock()?.catch?.(() => {}); } catch {}
        return;
      }
      // Keep the browser from moving focus on this click (it would steal it
      // from the chat box we focus below).
      e.preventDefault();
      const s = target;
      if (hoverAction === "orb") s.owner.cluster ? closeCluster(s.owner) : openCluster(s.owner);
      else if (hoverAction === "close") closeCluster(s.owner);
      else if (hoverAction === "send") sendChat(s.owner);
      else if (hoverAction === "chat") {
        // Free the mouse so you can type; WASD pauses while the box has focus.
        document.exitPointerLock();
        s.input.focus();
      } else if (hoverAction === "back" && s.history.length) loadPage(s, s.history.pop(), { push: false });
      else if (hoverLink) follow(s, hoverLink);
    });

    // While looking, the wheel scrolls the open page (or chat) under the dot.
    addEventListener("wheel", (e) => {
      if (!looking || !target) return;
      if (target.kind === "tile" && target.open) target.frame.contentWindow?.scrollBy(0, e.deltaY);
      else if (target.kind === "menu") target.log.scrollBy(0, e.deltaY);
      else return;
      e.preventDefault();
    }, { passive: false });

    let lookDX = 0, lookDY = 0;
    document.addEventListener("pointerlockchange", () => {
      looking = document.pointerLockElement === canvas;
    });
    document.addEventListener("mousemove", (e) => {
      if (!looking) return;
      lookDX += e.movementX;
      lookDY += e.movementY;
    });

    function applyLook() {
      // Pick up any rotation Spark applied (arrow keys), then add the mouse.
      const eul = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
      const yaw = eul.y - lookDX * 0.0022;
      const pitch = THREE.MathUtils.clamp(eul.x - lookDY * 0.0022, -1.45, 1.45);
      lookDX = lookDY = 0;
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
    }

    // ---------- Keys ----------
    addEventListener("keydown", async (e) => {
      if (typing() || e.repeat || e.metaKey || e.ctrlKey) return;
      const key = e.key.toLowerCase();
      if (key === "t") {
        if (document.pointerLockElement) document.exitPointerLock();
        // Place a label 3m in front of wherever you're looking.
        const text = prompt("Floating text:");
        if (!text?.trim()) return;
        const topic = prompt("Topic for its pages (optional):")?.trim();
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        const p = camera.position.clone().addScaledVector(dir, 3);
        labels = [...labels, { text: text.trim(), position: p.toArray().map((n) => +n.toFixed(2)), size: 1,
          color: "#ffffff", query: topic || text.trim() }];
        saveLabels();
        buildAll();
      } else if (key === "u" && labels.length) {
        labels = labels.slice(0, -1);
        saveLabels();
        buildAll();
      } else if (key === "p") {
        uiVisible = !uiVisible;
      }
    });

    buildAll();

    // ---------- Frame loop ----------
    renderer.setAnimationLoop((time) => {
      controls.update(camera);
      applyLook();
      camera.updateMatrixWorld();
      layout(time);
      aim();
      renderer.render(scene, camera);
    });

    // Hooks for automated tests (headless browsers can't lock the pointer).
    const aimAt = (v) => {
      const d = v.clone().sub(camera.position);
      camera.quaternion.setFromEuler(new THREE.Euler(Math.atan2(d.y, Math.hypot(d.x, d.z)), Math.atan2(-d.x, -d.z), 0, "YXZ"));
    };
    window.__world = {
      setLooking(v) { looking = v; },
      // Aim at the centre of an element's on-screen box (iterate to converge).
      aimAtEl(el) {
        const r = el.getBoundingClientRect();
        const focal = (innerHeight / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        lookDX += Math.atan((r.left + r.width / 2 - innerWidth / 2) / focal) / 0.0022;
        lookDY += Math.atan((r.top + r.height / 2 - innerHeight / 2) / focal) / 0.0022;
      },
      orb: (i) => items[i].orb.el,
      menuEl: (i, sel) => items[i].cluster?.menu.el.querySelector(sel),
      tileEl: (i, k) => items[i].cluster?.tiles[k].el,
      walkToTile(i, k, dist) {
        const s = items[i].cluster.tiles[k];
        const mid = s.pos.clone().setY(s.pos.y - 0.5);
        camera.position.copy(mid).addScaledVector(items[i].toward, dist);
        aimAt(mid);
      },
      state: () => ({
        looking, target: target?.kind ?? null, action: hoverAction, link: hoverLink?.textContent.trim() ?? null,
        clusters: items.filter((it) => it.cluster).map((it) => it.data.text),
        tiles: (items.find((it) => it.cluster)?.cluster.tiles ?? []).map((t) => ({ open: t.open, url: t.url && niceTitle(t.url), current: t.current && niceTitle(t.current) })),
        scroll: target?.kind === "tile" ? target.frame.contentWindow?.scrollY : null,
        typing: typing(),
        chat: [...(items.find((it) => it.cluster)?.cluster.menu.log.children ?? [])].map((n) => n.textContent.slice(0, 80)),
      }),
    };
  </script>
</body>
</html>
