<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midtown NYC — a World Labs Marble world</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; top: 16px; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
    .hud h1 { margin: 0 0 4px; font-size: 15px; }
    .hud p { margin: 2px 0; color: rgba(255,255,255,.7); }
    .hud a { color: #9cf; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <h1>Midtown NYC</h1>
    <p>WASD move · drag look · Q/E down/up · Shift faster</p>
    <p>T add floating text · U undo · C copy labels</p>
    <p id="quality"></p>
  </div>
  <div id="status">Loading 3D world…</div>

  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

    const world = await (await fetch("./world.json")).json();
    const full = new URLSearchParams(location.search).get("quality") === "full";
    const url = full ? world.assets.full_res_spz_url : "./assets/nyc_500k.spz";

    const q = document.getElementById("quality");
    q.innerHTML = full
      ? `Full resolution (~69 MB) · <a href="?">use 500k</a>`
      : `500k splats · <a href="?quality=full">load full resolution (~69 MB)</a>`;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
    scene.add(new SparkRenderer({ renderer }));

    const splats = new SplatMesh({ url });
    // Marble SPZ files use an OpenCV frame; rotate 180° about X for three.js (y-up).
    splats.quaternion.set(1, 0, 0, 0);
    scene.add(splats);

    const status = document.getElementById("status");
    splats.initialized
      .then(() => status.remove())
      .catch((e) => { status.textContent = "Couldn't load the 3D world: " + e; });

    const controls = new SparkControls({ canvas: renderer.domElement });
    controls.fpsMovement.moveSpeed = 1.5;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Floating text ----------
    // Text is drawn to a canvas and shown on a sprite, so it always faces the
    // camera. depthTest is off so splats never hide it.
    function makeLabel({ text, color = "#ffffff", size = 1 }) {
      const font = "600 64px system-ui, -apple-system, Helvetica, sans-serif";
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = font;
      const padX = 36, padY = 22;
      const w = Math.ceil(ctx.measureText(text).width) + padX * 2;
      const h = 64 + padY * 2;
      c.width = w;
      c.height = h;
      ctx.font = font;
      ctx.fillStyle = "rgba(10,12,20,0.45)";
      ctx.beginPath();
      ctx.roundRect(0, 0, w, h, h / 2);
      ctx.fill();
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = color;
      ctx.textBaseline = "middle";
      ctx.fillText(text, padX, h / 2 + 2);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }),
      );
      const height = 0.35 * size; // world units (≈ metres)
      sprite.scale.set((height * w) / h, height, 1);
      sprite.renderOrder = 10;
      return sprite;
    }

    // Default labels. Positions are [x, y, z] relative to the starting
    // viewpoint: -z is straight ahead, +x is right, +y is up.
    const DEFAULT_LABELS = [
      { text: "Midtown Manhattan", position: [0, 3.2, -9], size: 2, color: "#ffffff" },
      // Cars, estimated from where they sit in the panorama
      // (left yellow cab, center yellow cab, white sedan on the right).
      { text: "car", position: [-5.5, 0.15, -7.1], size: 1.3, color: "#ffd84a" },
      { text: "car", position: [2.2, 0.15, -8.7], size: 1.3, color: "#ffd84a" },
      { text: "car", position: [7.4, 0.15, -3.1], size: 1.3, color: "#ffffff" },
      { text: "🌭 Street vendors", position: [-5, 1.8, 4], size: 1, color: "#ff8a8a" },
      { text: "✨ Generated with World Labs Marble", position: [0, 0.9, -4], size: 0.7, color: "#9fd4ff" },
    ];
    const STORE = "nyc-world-labels";
    let labels = JSON.parse(localStorage.getItem(STORE) ?? "null") ?? DEFAULT_LABELS;
    const sprites = [];

    function renderLabels() {
      for (const s of sprites.splice(0)) {
        scene.remove(s);
        s.material.map.dispose();
        s.material.dispose();
      }
      labels.forEach((l, i) => {
        const s = makeLabel(l);
        s.position.fromArray(l.position);
        s.userData.baseY = l.position[1];
        s.userData.phase = i * 1.3;
        scene.add(s);
        sprites.push(s);
      });
    }
    const saveLabels = () => localStorage.setItem(STORE, JSON.stringify(labels));
    renderLabels();

    addEventListener("keydown", async (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey) return;
      const key = e.key.toLowerCase();
      if (key === "t") {
        // Place text 3m in front of wherever you're looking.
        const text = prompt("Floating text:");
        if (!text?.trim()) return;
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        const p = camera.position.clone().addScaledVector(dir, 3);
        labels = [...labels, { text: text.trim(), position: p.toArray().map((n) => +n.toFixed(2)), size: 1, color: "#ffffff" }];
        saveLabels();
        renderLabels();
      } else if (key === "u" && labels.length) {
        labels = labels.slice(0, -1);
        saveLabels();
        renderLabels();
      } else if (key === "c") {
        // Paste the result into DEFAULT_LABELS to make your labels permanent.
        const json = JSON.stringify(labels, null, 2);
        console.log(json);
        await navigator.clipboard?.writeText(json).catch(() => {});
        alert("Labels copied to clipboard (also printed in the console).");
      }
    });

    renderer.setAnimationLoop((time) => {
      controls.update(camera);
      // Gentle floating bob
      const t = time / 1000;
      for (const s of sprites) s.position.y = s.userData.baseY + Math.sin(t * 1.2 + s.userData.phase) * 0.08;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
