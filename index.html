<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midtown NYC — a World Labs Marble world</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; top: 16px; z-index: 3; padding: 8px 12px; border-radius: 8px;
           background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
    .hud h1 { margin: 0 0 4px; font-size: 15px; }
    .hud p { margin: 2px 0; color: rgba(255,255,255,.7); }
    .hud a { color: #9cf; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.75); pointer-events: none; z-index: 4; }

    /* Web pages floating in the world. They are positioned every frame with a
       2D transform (projected from 3D), which keeps them hit-testable so they
       can be used in place. Only the page you're using receives the mouse. */
    #pages { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .page-panel { position: absolute; left: 0; top: 0; width: 800px; height: 600px; display: flex; flex-direction: column;
                  border-radius: 18px; overflow: hidden; background: #fff; pointer-events: none;
                  box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 20px 60px rgba(0,0,0,.6);
                  transition: box-shadow .15s; will-change: transform; }
    .page-panel.targeted { box-shadow: 0 0 0 8px #4da3ff, 0 0 60px rgba(77,163,255,.8); }
    .page-panel.active { box-shadow: 0 0 0 8px #3ddc84, 0 0 60px rgba(61,220,132,.8); pointer-events: auto; }
    .page-panel iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
    .bar { display: flex; align-items: center; height: 44px; padding: 0 16px; flex: none;
           background: #14161f; color: rgba(255,255,255,.85); font: 600 17px system-ui, sans-serif;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Crosshair + hints */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
                 z-index: 3; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff;
                 box-shadow: 0 0 0 1px rgba(0,0,0,.6); border-radius: 1px; }
    #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
    #crosshair.on-page::before, #crosshair.on-page::after { background: #4da3ff; }
    #crosshair.hidden { display: none; }
    #hint { position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); z-index: 3;
            padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff;
            font: 600 13px system-ui, sans-serif; pointer-events: none; white-space: nowrap; }
    #hint:empty { display: none; }
    #hint.bottom { top: auto; bottom: 24px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <h1>Midtown NYC</h1>
    <p>Click to look around with the mouse · WASD move · Q/E down/up · Shift faster</p>
    <p>Aim the crosshair at a page and click to use it · Esc / click the scene to go back</p>
    <p>T add floating text · U undo · C copy labels · P show/hide pages</p>
    <p id="quality"></p>
  </div>
  <div id="pages"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="status">Loading 3D world…</div>

  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

    const world = await (await fetch("./world.json")).json();
    const full = new URLSearchParams(location.search).get("quality") === "full";
    const url = full ? world.assets.full_res_spz_url : "./assets/nyc_500k.spz";

    const q = document.getElementById("quality");
    q.innerHTML = full
      ? `Full resolution (~69 MB) · <a href="?">use 500k</a>`
      : `500k splats · <a href="?quality=full">load full resolution (~69 MB)</a>`;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
    scene.add(new SparkRenderer({ renderer }));

    const splats = new SplatMesh({ url });
    // Marble SPZ files use an OpenCV frame; rotate 180° about X for three.js (y-up).
    splats.quaternion.set(1, 0, 0, 0);
    scene.add(splats);

    const status = document.getElementById("status");
    splats.initialized
      .then(() => status.remove())
      .catch((e) => { status.textContent = "Couldn't load the 3D world: " + e; });

    // Spark handles WASD/QE movement; mouse-look is ours (pointer lock).
    const controls = new SparkControls({ canvas });
    controls.fpsMovement.moveSpeed = 1.5;
    controls.pointerControls.enable = false;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- Floating text ----------
    // Text is drawn to a canvas and shown on a sprite, so it always faces the
    // camera. depthTest is off so splats never hide it.
    function makeLabel({ text, color = "#ffffff", size = 1 }) {
      const font = "600 64px system-ui, -apple-system, Helvetica, sans-serif";
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.font = font;
      const padX = 36, padY = 22;
      const w = Math.ceil(ctx.measureText(text).width) + padX * 2;
      const h = 64 + padY * 2;
      c.width = w;
      c.height = h;
      ctx.font = font;
      ctx.fillStyle = "rgba(10,12,20,0.45)";
      ctx.beginPath();
      ctx.roundRect(0, 0, w, h, h / 2);
      ctx.fill();
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = color;
      ctx.textBaseline = "middle";
      ctx.fillText(text, padX, h / 2 + 2);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }),
      );
      const height = 0.35 * size; // world units (≈ metres)
      sprite.scale.set((height * w) / h, height, 1);
      sprite.renderOrder = 10;
      return sprite;
    }

    // Default labels. Positions are [x, y, z] relative to the starting
    // viewpoint: -z is straight ahead, +x is right, +y is up.
    // `url` (optional) shows a live web page under the label; `pageWidth` is
    // its width in metres. Only sites that allow embedding will display.
    const WIKI = "https://en.wikipedia.org/wiki/";
    const DEFAULT_LABELS = [
      { text: "Midtown Manhattan", position: [0, 3.2, -9], size: 2, color: "#ffffff",
        url: WIKI + "Midtown_Manhattan", pageWidth: 3.2 },
      // Cars, estimated from where they sit in the panorama
      // (left yellow cab, center yellow cab, white sedan on the right).
      { text: "car", position: [-5.5, 0.15, -7.1], size: 1.3, color: "#ffd84a",
        url: WIKI + "Taxicabs_of_New_York_City", pageWidth: 1.4 },
      { text: "car", position: [2.2, 0.15, -8.7], size: 1.3, color: "#ffd84a",
        url: WIKI + "Taxicabs_of_New_York_City", pageWidth: 1.4 },
      { text: "car", position: [7.4, 0.15, -3.1], size: 1.3, color: "#ffffff",
        url: WIKI + "Car", pageWidth: 1.4 },
      { text: "🌭 Street vendors", position: [-5, 1.8, 4], size: 1, color: "#ff8a8a",
        url: WIKI + "Hot_dog_cart", pageWidth: 1.6 },
      { text: "✨ Generated with World Labs Marble", position: [3.5, 0.2, -4], size: 0.7, color: "#9fd4ff",
        url: "https://sparkjs.dev/", pageWidth: 1.2 },
    ];
    const STORE = "nyc-world-labels-v2";
    let labels = JSON.parse(localStorage.getItem(STORE) ?? "null") ?? DEFAULT_LABELS;
    const sprites = [];
    const panels = []; // { el, pos: Vector3, baseY, phase, widthM, url, title }
    let pagesVisible = true;
    const pagesLayer = document.getElementById("pages");

    // ---------- Web pages ----------
    const PANEL_W = 800, PANEL_H = 600; // CSS px; scaled to `pageWidth` metres

    function makeFrame(url) {
      const iframe = document.createElement("iframe");
      // Wikipedia's mobile skin reads far better in a small panel.
      if (/^https:\/\/[a-z]+\.wikipedia\.org\/wiki\//.test(url) && !url.includes("useskin=")) {
        url += (url.includes("?") ? "&" : "?") + "useskin=minerva";
      }
      iframe.src = url;
      iframe.referrerPolicy = "no-referrer";
      // Pages run sandboxed: scripts, links and forms work, but they can't
      // touch this page.
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms");
      return iframe;
    }

    function makePanel(url, widthM, title) {
      const el = document.createElement("div");
      el.className = "page-panel";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.textContent = title;
      el.append(bar, makeFrame(url));
      pagesLayer.appendChild(el);
      return { el, pos: new THREE.Vector3(), widthM, heightM: (PANEL_H * widthM) / PANEL_W, url, title };
    }

    function renderLabels() {
      setActive(null);
      for (const s of sprites.splice(0)) {
        scene.remove(s);
        s.material.map.dispose();
        s.material.dispose();
      }
      for (const p of panels.splice(0)) p.el.remove();
      labels.forEach((l, i) => {
        const s = makeLabel(l);
        s.position.fromArray(l.position);
        s.userData.baseY = l.position[1];
        s.userData.phase = i * 1.3;
        scene.add(s);
        sprites.push(s);

        if (l.url) {
          const p = makePanel(l.url, l.pageWidth ?? 1.6, l.text);
          // Hang the page just below the label.
          const gap = 0.1;
          p.baseY = l.position[1] - s.scale.y / 2 - gap - p.heightM / 2;
          p.pos.set(l.position[0], p.baseY, l.position[2]);
          p.phase = s.userData.phase;
          panels.push(p);
        }
      });
    }

    // Project each page from 3D to the screen and place it with a 2D transform.
    const tmp = new THREE.Vector3();
    function layoutPanels() {
      const halfH = innerHeight / 2;
      const focal = halfH / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      for (const p of panels) {
        tmp.copy(p.pos).applyMatrix4(camera.matrixWorldInverse);
        const depth = -tmp.z;
        if (!pagesVisible || depth < 0.3) {
          p.el.style.visibility = "hidden";
          p.onScreen = false;
          continue;
        }
        tmp.copy(p.pos).project(camera);
        const sx = (tmp.x + 1) * innerWidth / 2;
        const sy = (1 - tmp.y) * halfH;
        const scale = (p.widthM * focal) / depth / PANEL_W;
        const offScreen = Math.abs(tmp.x) > 2 || Math.abs(tmp.y) > 2;
        p.el.style.visibility = offScreen ? "hidden" : "visible";
        p.onScreen = !offScreen;
        p.depth = depth;
        p.el.style.transform =
          `translate(${sx - PANEL_W / 2}px, ${sy - PANEL_H / 2}px) scale(${scale})`;
        p.el.style.zIndex = String(Math.max(1, Math.round(100000 - depth * 100)));
      }
    }

    // Front-most visible page under a screen point.
    function panelAt(x, y) {
      let best = null;
      for (const p of panels) {
        if (!p.onScreen) continue;
        const r = p.el.getBoundingClientRect();
        if (x < r.left || x > r.right || y < r.top || y > r.bottom) continue;
        if (!best || p.depth < best.depth) best = p;
      }
      return best;
    }

    // ---------- Look / aim / use ----------
    // Modes:
    //   "idle" — mouse free, nothing selected (click anywhere to look around)
    //   "look" — pointer locked: mouse turns the view, crosshair aims
    //   "page" — using a page in place: mouse free, only that page is live
    let mode = "idle";
    let target = null; // page under the crosshair while looking
    let active = null; // page being used
    let pendingActivate = null;
    let yaw = 0, pitch = 0, lookDX = 0, lookDY = 0;
    const crosshair = document.getElementById("crosshair");
    const hint = document.getElementById("hint");

    function setActive(p) {
      active?.el.classList.remove("active");
      active = p;
      active?.el.classList.add("active");
    }
    function setTarget(p) {
      if (p === target) return;
      target?.el.classList.remove("targeted");
      target = p;
      target?.el.classList.add("targeted");
    }

    function updateUi() {
      crosshair.classList.toggle("hidden", mode === "page");
      crosshair.classList.toggle("on-page", mode === "look" && !!target);
      hint.classList.toggle("bottom", mode !== "look");
      hint.textContent =
        mode === "look" ? (target ? `Click to use “${target.title}”` : "")
        : mode === "page" ? `Using “${active.title}” · click the scene or press Esc to look around again`
        : "Click to look around";
    }

    function startLook() {
      setActive(null);
      try {
        const r = canvas.requestPointerLock();
        r?.catch?.(() => {});
      } catch {}
    }

    canvas.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (mode === "look") {
        if (target) {
          // Release the mouse right where the crosshair is, over the page.
          pendingActivate = target;
          document.exitPointerLock();
        }
      } else {
        // Clicking the scene (anywhere but the active page) → look around.
        document.activeElement?.blur();
        setActive(null);
        mode = "idle";
        updateUi();
        startLook();
      }
    });

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement === canvas) {
        mode = "look";
        setActive(null);
      } else if (pendingActivate) {
        mode = "page";
        setTarget(null);
        setActive(pendingActivate);
        pendingActivate = null;
      } else {
        mode = "idle";
        setTarget(null);
      }
      updateUi();
    });

    document.addEventListener("mousemove", (e) => {
      if (mode !== "look") return;
      lookDX += e.movementX;
      lookDY += e.movementY;
    });

    function applyLook() {
      // Pick up any rotation Spark applied (arrow keys), then add the mouse.
      const eul = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
      yaw = eul.y - lookDX * 0.0022;
      pitch = THREE.MathUtils.clamp(eul.x - lookDY * 0.0022, -1.45, 1.45);
      lookDX = lookDY = 0;
      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
    }

    // ---------- Keys ----------
    addEventListener("keydown", async (e) => {
      if (e.key === "Escape" && mode === "page") {
        setActive(null);
        mode = "idle";
        updateUi();
        return;
      }
      if (e.repeat || e.metaKey || e.ctrlKey) return;
      const key = e.key.toLowerCase();
      if (key === "t") {
        if (document.pointerLockElement) document.exitPointerLock();
        // Place text 3m in front of wherever you're looking.
        const text = prompt("Floating text:");
        if (!text?.trim()) return;
        const pageUrl = prompt("Web page to show below it (optional, https://…):")?.trim();
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);
        const p = camera.position.clone().addScaledVector(dir, 3);
        const label = { text: text.trim(), position: p.toArray().map((n) => +n.toFixed(2)), size: 1, color: "#ffffff" };
        if (pageUrl && /^https:\/\//.test(pageUrl)) Object.assign(label, { url: pageUrl, pageWidth: 1.6 });
        labels = [...labels, label];
        saveLabels();
        renderLabels();
      } else if (key === "u" && labels.length) {
        labels = labels.slice(0, -1);
        saveLabels();
        renderLabels();
      } else if (key === "p") {
        pagesVisible = !pagesVisible;
        if (!pagesVisible) { setTarget(null); setActive(null); if (mode === "page") mode = "idle"; updateUi(); }
      } else if (key === "c") {
        if (document.pointerLockElement) document.exitPointerLock();
        // Paste the result into DEFAULT_LABELS to make your labels permanent.
        const json = JSON.stringify(labels, null, 2);
        console.log(json);
        await navigator.clipboard?.writeText(json).catch(() => {});
        alert("Labels copied to clipboard (also printed in the console).");
      }
    });

    const saveLabels = () => localStorage.setItem(STORE, JSON.stringify(labels));
    renderLabels();
    updateUi();

    // ---------- Frame loop ----------
    renderer.setAnimationLoop((time) => {
      controls.update(camera);
      applyLook();
      camera.updateMatrixWorld();

      // Gentle floating bob (the page you're using holds still).
      const t = time / 1000;
      for (const s of sprites) s.position.y = s.userData.baseY + Math.sin(t * 1.2 + s.userData.phase) * 0.08;
      for (const p of panels) {
        if (p !== active) p.pos.y = p.baseY + Math.sin(t * 1.2 + p.phase) * 0.08;
      }
      layoutPanels();

      if (mode === "look") {
        const before = target;
        setTarget(panelAt(innerWidth / 2, innerHeight / 2));
        if (before !== target) updateUi();
      }
      renderer.render(scene, camera);
    });

    // Small hook for automated tests: aim the camera at page i.
    window.__world = {
      get mode() { return mode; },
      aimAt(i) {
        const d = panels[i].pos.clone().sub(camera.position);
        const y = Math.atan2(-d.x, -d.z);
        const x = Math.atan2(d.y, Math.hypot(d.x, d.z));
        camera.quaternion.setFromEuler(new THREE.Euler(x, y, 0, "YXZ"));
      },
      targetTitle: () => target?.title ?? null,
      // Simulates "click while aiming" without pointer lock (headless can't lock).
      useTarget() {
        const p = panelAt(innerWidth / 2, innerHeight / 2);
        if (!p) return false;
        mode = "page"; setTarget(null); setActive(p); updateUi();
        return true;
      },
      lookMode() { mode = "look"; setActive(null); updateUi(); },
    };
  </script>
</body>
</html>
